name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint / Typecheck / Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows 目前**不阻断合并**：README 的「平台矩阵」写明 Windows 尚未完成
    # 真机验证（路径分隔符、autocrlf 换行、符号链接需管理员权限、文件锁导致
    # 清理 EBUSY —— 多数属平台适配而非逻辑缺陷）。把它留在这里是为了持续
    # 观测、防止腐化，但不能让它挡住 macOS/Linux 的真实回归。
    # 收紧成阻断的前置条件：Windows 单独开卡修完后删掉这一行。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 = 当前 LTS，同时与开发机一致；20 已在 runner 上标记弃用
          node-version: 22
          cache: npm

      - name: Verify environment (Node >= 20, Git >= 2.30)
        run: node scripts/verify-env.mjs --env-only

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
